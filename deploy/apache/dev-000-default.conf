# /etc/apache2/sites-available/000-default.conf on dev (192.168.1.81)
# prod (bioinfo5.ugr.es, HTTPS) proxies https://bioinfo5.ugr.es/dev/ -> http://192.168.1.81/dev/
# and this host proxies /dev/ to gunicorn (rnagrx_web under supervisor) on 127.0.0.1:8100.
ServerName  192.168.1.81
<VirtualHost *:80>
	Header always append X-Frame-Options SAMEORIGIN
	ServerAdmin webmaster@localhost

	# ---- rnagrx (new site) -------------------------------------------------------
	ProxyPreserveHost On
	ProxyTimeout 300
	# Django treats a request as HTTPS only if it came through prod (which terminates HTTPS);
	# the header is removed from everything else so it cannot be faked.
	RequestHeader unset X-Forwarded-Proto
	<If "-R '192.168.1.80'">
		RequestHeader set X-Forwarded-Proto "https"
	</If>
	RedirectMatch ^/dev$ /dev/
	ProxyPass        /dev/ http://127.0.0.1:8100/dev/
	ProxyPassReverse /dev/ http://127.0.0.1:8100/dev/

	# ---- old site (mod_wsgi), disabled 2026-11 ---------------------------------
	#WSGIDaemonProcess rnagrx python-home=/srv/rnagrx_dev/venv python-path=/srv/rnagrx_dev/ display-name=%{GROUP}
	#WSGIProcessGroup rnagrx
	#WSGIScriptAlias /dev /srv/rnagrx_dev/rnagrx_web/wsgi.py process-group=rnagrx application-group=%{GLOBAL}
	#<Directory /srv/rnagrx_dev/rnagrx_web>
	#	<Files wsgi.py>
	#		Require all granted
	#	</Files>
	#</Directory>
	#Alias /dev/static/ /srv/rnagrx_dev/static/
	#<Directory /srv/rnagrx_dev/static/>
	#	Require all granted
	#</Directory>
	# was a public listing of /scratch/upload; results are now downloaded through Django
	#Alias /dev/results/download/ /scratch/upload/
	#<Directory /scratch/upload/>
	#	Require all granted
	#</Directory>

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
