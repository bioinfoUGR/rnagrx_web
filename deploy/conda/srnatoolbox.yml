# srnatoolbox conda environment (conda-forge + bioconda only, no Anaconda "defaults")
# Build:  /var/www/conda/bin/conda env create -f srnatoolbox.yml
# The srnatoolbox Python package itself is installed afterwards with pip (editable on dev).
name: srnatoolbox
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  # aligners / bioinformatics tools
  - bowtie=1.3.1
  - trnascan-se
  - ncbi-datasets-cli
  - sra-tools
  - viennarna
  - blast
  - mirmachine
  # Python libraries (from srnatoolbox pyproject.toml, installed via conda)
  - biopython
  - pyfaidx
  - gffutils
  - pandas
  - numpy
  - scipy
  - matplotlib
  - seaborn
  - plotly
  - scikit-learn
  - statsmodels
  - rich
  - pymysql
  - python-dotenv
  - pip
  # R for differential expression
  - r-base=4.4
  - r-biocmanager
  - bioconductor-deseq2
  - bioconductor-edger
