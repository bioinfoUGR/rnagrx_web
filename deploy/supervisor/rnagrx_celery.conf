; Celery worker for the miSRA tools (queues separate from the old site). Install: sudo cp to /etc/supervisor/conf.d/
[program:rnagrx_celery]
command=/var/www/rnagrx/venv/bin/celery -A config worker -Q rnagrx_quick,rnagrx_heavy -c 2 -n rnagrx@%%h --loglevel INFO
directory=/var/www/rnagrx/app
user=www-data
group=www-data
umask=002
environment=HOME="/scratch/rnagrx"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=600
stdout_logfile=/var/www/rnagrx/logs/celery_worker.log
redirect_stderr=true
