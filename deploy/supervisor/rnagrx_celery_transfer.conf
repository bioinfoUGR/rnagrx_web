; Celery worker for dataset transfers: link downloads and unpacking of archives (jobs/datasets.py).
; Separate from rnagrx_celery so that long downloads never hold up the tool jobs.
; Install: sudo cp to /etc/supervisor/conf.d/ && sudo supervisorctl reread && sudo supervisorctl update
[program:rnagrx_celery_transfer]
command=/var/www/rnagrx/venv/bin/celery -A config worker -Q rnagrx_transfer -c 4 -n rnagrx_transfer@%%h --loglevel INFO
directory=/var/www/rnagrx/app
user=www-data
group=www-data
umask=002
environment=HOME="/scratch/rnagrx"
autostart=true
autorestart=true
; at boot /var/www (GlusterFS) can be mounted after supervisor starts: keep retrying (~30 min)
startretries=60
stopasgroup=true
killasgroup=true
; a running download is started again after a restart (acks_late)
stopwaitsecs=60
stdout_logfile=/var/www/rnagrx/logs/celery_transfer.log
redirect_stderr=true
