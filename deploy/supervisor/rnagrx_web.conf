; gunicorn for the rnagrx site. Install: sudo cp to /etc/supervisor/conf.d/
[program:rnagrx_web]
command=/var/www/rnagrx/venv/bin/gunicorn -c /var/www/rnagrx/app/deploy/gunicorn/gunicorn.conf.py config.wsgi
directory=/var/www/rnagrx/app
user=www-data
group=www-data
umask=002
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/var/www/rnagrx/logs/gunicorn_supervisor.log
redirect_stderr=true
