<div class="{{ col }}">
  {% if f.field.widget.input_type == "checkbox" %}
  <div class="form-check">{{ f }} <label class="form-check-label" for="{{ f.id_for_label }}">{{ f.label }}</label></div>
  {% else %}
  <label class="form-label small fw-semibold" for="{{ f.id_for_label }}">{{ f.label }}{% if optional %} <span class="fw-normal text-secondary">(optional)</span>{% endif %}</label>{{ f }}
  {% if f.help_text %}<div class="form-text">{{ f.help_text }}</div>{% endif %}
  {% endif %}
  {% for e in f.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
</div>
